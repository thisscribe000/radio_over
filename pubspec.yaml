name: radio_over
description: "A minimalist internet radio + podcast mobile app."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.11.1

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.0
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  http: ^1.6.0
  just_audio: ^0.10.6
  path: ^1.9.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  xml: ^6.6.1
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFF0"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#FFFFF0"
  image: "assets/icon/splash_logo.png"
  android_12:
    color: "#FFFFF0"
    image: "assets/icon/splash_logo.png"
    icon_background_color: "#FFFFF0"
  ios: true
  android: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
