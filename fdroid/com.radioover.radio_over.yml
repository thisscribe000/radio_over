  - Radio
  - Podcast
License: MIT
AuthorName: Radio Over Contributors
SourceCode: https://github.com/thisscribe000/radio_over
IssueTracker: https://github.com/thisscribe000/radio_over/issues
Changelog: https://github.com/thisscribe000/radio_over/releases

AutoName: Radio Over

RepoType: git
Repo: https://github.com/thisscribe000/radio_over.git

Builds:
  - versionName: 2.0.0
    versionCode: 21
    commit: 53056ff42aba02c8f1186a0c9ce373561c07a0ce
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"

  - versionName: 2.0.0
    versionCode: 22
